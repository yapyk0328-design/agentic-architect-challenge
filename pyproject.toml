[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-architect-challenge"
version = "0.1.0"
description = "Developer intern challenge: reliable website scraping and concise summarization"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "trafilatura>=2,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
summarize-webpage = "web_summarizer.cli:main"
document-agent = "document_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

